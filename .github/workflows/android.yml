name: Android APK and tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leafnotes-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: Build APK and run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run local unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeafNotes-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-instrumented-tests:
    name: Run tests on Android emulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android tests on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            set -o pipefail
            gradle --no-daemon connectedDebugAndroidTest --stacktrace
      - name: Capture emulator diagnostics on failure
        if: failure()
        run: |
          mkdir -p app/build/diagnostics
          adb devices -l > app/build/diagnostics/adb-devices.txt || true
          adb logcat -d -v threadtime > app/build/diagnostics/logcat.txt || true
          adb shell dumpsys activity processes > app/build/diagnostics/processes.txt || true
      - name: Upload Android test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LeafNotes-android-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
